name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Sync dependencies
        run: uv sync --frozen

      - name: Install DuckDB sqlite extension
        run: uv run python -c "import duckdb; duckdb.connect(':memory:').execute('INSTALL sqlite')"

      - name: Lint (ruff check)
        run: uv run ruff check .

      - name: Format check (ruff format)
        run: uv run ruff format --check .

      - name: Test (pytest)
        env:
          ACETATE_DB: ${{ runner.temp }}/acetate-ci.db
        run: uv run pytest -q

      - name: Build package
        run: uv build
