[project]
name = "acetate"
version = "0.2.0"
description = "Personal Spotify backup, play-history snapshotting, and auto-playlist tools"
authors = [{ name = "Charles Bine" }]
license = { text = "MIT" }
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "spotipy>=2.24.0",
    "python-dotenv>=1.0.0",
    "typer>=0.12.0",
    "rich>=13.7.0",
    "loguru>=0.7.0",
    "requests>=2.31.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "jinja2>=3.1.0",
    "python-multipart>=0.0.9",
    "apscheduler>=3.10.0",
    "openai>=1.40.0",
    "tzdata>=2024.1",
    "numpy>=2.0",
    "duckdb>=1.5.4",
]

[project.optional-dependencies]
ytmusic = ["ytmusicapi>=1.12.1"]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.6.0",
]

[project.scripts]
acetate = "acetate.cli:app"

[project.urls]
Homepage = "https://github.com/charlesbine/acetate"
Repository = "https://github.com/charlesbine/acetate"
Issues = "https://github.com/charlesbine/acetate/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["acetate"]

[tool.ruff]
line-length = 100
target-version = "py312"
